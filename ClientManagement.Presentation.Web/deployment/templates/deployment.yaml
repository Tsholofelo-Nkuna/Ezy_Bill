apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.appName}}
  namespace: {{.Values.namespace}}
  labels:
    app: {{.Values.appName}}
spec:
  replicas: {{.Values.replicaCount}}
  selector:
    matchLabels:
      app: {{.Values.appName}}
  template:
    metadata:
      labels:
        app: {{.Values.appName}}
    spec:
      containers:
        - name: {{.Values.appName}}
          image: "{{.Values.image.repository}}/{{.Values.appName}}:{{.Values.image.tag}}"
          imagePullPolicy: {{.Values.image.pullPolicy}}
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
          envFrom:
            - configMapRef:
                name: {{.Values.appConfigName}}
            - secretRef:
                name: {{.Values.appSecretName}}
        - name: {{.Values.mcpName}}
          image: "{{.Values.image.repository}}/{{.Values.mcpName}}:{{.Values.image.tag}}"
          imagePullPolicy: {{.Values.image.pullPolicy}}
          ports:
            - containerPort: 8082
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8082"
          envFrom:
            - configMapRef:
                name: {{.Values.appConfigName}}
            - secretRef:
                name: {{.Values.appSecretName}}
        - name: ollama
          image: "alpine/ollama:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434
          env:
          resources:
            limits:
              cpu: "4"
              memory: 8Gi
              # ://nvidia.com: "1" # Uncomment if your cluster nodes have GPUs
            requests:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama
      volumes:
        - name: ollama-storage
          hostPath:
            path: /var/lib/ollama/ollamamodels # On your physical host machine
            type: DirectoryOrCreate     
