apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.appName}}
  namespace: {{.Values.namespace}}
  labels:
    app: {{.Values.appName}}
spec:
  replicas: {{.Values.replicaCount}}
  selector:
    matchLabels:
      app: {{.Values.appName}}
  template:
    metadata:
      labels:
        app: {{.Values.appName}}
    spec:
      containers:
        - name: {{.Values.appName}}
          image: "{{.Values.image.repository}}/{{.Values.appName}}:{{.Values.image.tag}}"
          imagePullPolicy: {{.Values.image.pullPolicy}}
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
          envFrom:
            - configMapRef:
                name: {{.Values.appConfigName}}
            - secretRef:
                name: {{.Values.appSecretName}}
        - name: {{.Values.mcpName}}
          image: "{{.Values.image.repository}}/{{.Values.mcpName}}:{{.Values.image.tag}}"
          imagePullPolicy: {{.Values.image.pullPolicy}}
          ports:
            - containerPort: 8082
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8082"
          envFrom:
            - configMapRef:
                name: {{.Values.appConfigName}}
            - secretRef:
                name: {{.Values.appSecretName}}
