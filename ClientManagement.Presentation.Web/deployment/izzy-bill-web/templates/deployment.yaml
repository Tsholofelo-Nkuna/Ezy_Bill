apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      containers:
        - name: {{ .Values.appName }}
          image: "{{ .Values.image.repository }}/{{ .Values.appName }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: agent-storagekey-map
              mountPath: {{ .Values.agentStoreKeyMapMountPath }}
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
          envFrom:
            - configMapRef:
                name: {{ .Values.appConfigName }}
            - secretRef:
                name: {{ .Values.appSecretName }}
        
        - name: {{ .Values.mcpName }}
          image: "{{ .Values.image.repository }}/{{ .Values.mcpName }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8082
          volumeMounts:
            - name: agent-storagekey-map
              mountPath: {{ .Values.agentStoreKeyMapMountPath }}
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8082"
          envFrom:
            - configMapRef:
                name: {{ .Values.appConfigName }}
            - secretRef:
                name: {{ .Values.appSecretName }}

        - name: ollama
          image: "alpine/ollama:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama
          resources:
            limits:
              cpu: 4
              memory: 6Gi
            requests:
              cpu: 2
              memory: 4Gi
      volumes:
        - name: ollama-storage
          hostPath:
            path: /var/lib/ollama/ollamamodels
            type: DirectoryOrCreate 
        - name: agent-storagekey-map
          configMap:
            name: {{ .Values.agentStoreKeyMapName }}
            items:
              - key: agent-storekey-map.json
                path: agent-storekey-map.json              
---
# Headless Service for Qdrant
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: {{ .Values.namespace }}
spec:
  clusterIP: None
  selector:
    app: qdrant
  ports:
    - port: 6333
      name: http
    - port: 6334
      name: grpc
---

