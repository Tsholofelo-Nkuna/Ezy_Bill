# ASP.NET Core (.NET Framework)


# Build and test ASP.NET Core projects targeting the full .NET Framework.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
- master

pool:
  vmImage: 'windows-latest'

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
# - task: DotNetCoreCLI@2
#   displayName: 'Restore NuGet Packages'
#   inputs:
#     command: 'restore'
#     projects: '**/*.sln'          # or '**/*.csproj' if you prefer
#     feedsToUse: 'select'          
# 1. Explicit Restore Step
- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet Packages'
  inputs:
    command: 'restore'
    projects: '**/ClientManagement.Presentation.Web.csproj'
    feedsToUse: 'select' # Adjust if using a custom NuGet.config

- task: Bash@3
  inputs:
    targetType: 'inline'
    script: |
      dotnet tool install -g Microsoft.Web.LibraryManager.Cli
      cd ./Core.Presentation.ViewComponents
      libman restore
# 2. Build Step (with --no-restore)
- task: DotNetCoreCLI@2
  displayName: 'Build ClientManagement.Web'
  inputs:
    command: 'build'
    projects: '**/ClientManagement.Presentation.Web.csproj'
    # --no-restore prevents conflicts with authenticated feeds
    arguments: '--configuration Release --no-restore'

    
