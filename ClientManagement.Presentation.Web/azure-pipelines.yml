# ASP.NET Core (.NET Framework) 

# Build and test ASP.NET Core projects targeting the full .NET Framework.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
- master

pool:
  vmImage: 'windows-latest'

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
stages:
  - stage: Build
    jobs:
    - job: Build
      displayName: "Build ClientManagement.Web"
      steps:
      - task: Bash@3
        inputs:
          targetType: 'inline'
          script: |
            dotnet tool install -g Microsoft.Web.LibraryManager.Cli
            cd ./Core.Presentation.ViewComponents
            libman restore
      # 2. Build Step (with --no-restore)
      - task: DotNetCoreCLI@2
        displayName: 'Build ClientManagement.Web'
        inputs:
          command: 'build'
          projects: '**/ClientManagement.Presentation.Web.csproj'
          arguments: '--configuration Release'
  - stage: Test
    displayName: "Run unit tests"
    jobs:
      - job: Test
        steps:
        - task: Bash@3
          inputs:
            targetType: 'inline'
            script: |
              dotnet tool install -g Microsoft.Web.LibraryManager.Cli
              cd ./Core.Presentation.ViewComponents
              libman restore
        - task: DotNetCoreCLI@2
          displayName: "Unit test run"
          inputs:
            command: 'test'
            projects: '**/ClientManagement.UnitTests.csproj'
            testRunTitle: 'Run Unit Tests'
  - stage: Package
    jobs:
        - job: Package
          displayName: 'Package ClientManagment.Web'
          steps:
          - task: Bash@3
            inputs:
              targetType: 'inline'
              script: |
                dotnet tool install -g Microsoft.Web.LibraryManager.Cli
                libman restore --file ./Core.Presentation.ViewComponents/libman.json
                dotnet pack ./ClientManagement.Presentation.Web/ --output $BUILD_ARTIFACTSTAGINGDIRECTORY
              
          - task: DotNetCoreCLI@2
            displayName: 'dotnet push'
            inputs:
              command: 'push'
              packagesToPush: '$(Build.ArtifactStagingDirectory)/ClientManagement.Presentation.Web.*.nupkg'
              publishVstsFeed: 'tgnkuna768' # The name of your Azure Artifacts feed

                          
